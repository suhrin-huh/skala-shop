# SKALA-FUND 로컬 통합 환경 (INF-10)
#
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml logs -f backend
#   docker compose -f docker-compose.local.yml down -v      # -v 를 붙이면 DB 도 초기화된다
#
# 프론트는 이 파일에 없다. Vite dev server 로 따로 띄운다.
#   cd frontend && npm run dev      -> http://localhost:3000
# vite.config.js 의 proxy 가 /api 요청을 http://localhost:8080 으로 넘긴다.
#
# 이 구성의 진짜 목적은 "prod 와 같은 조건에서 Flyway 를 돌려보는 것"이다.
# MySQL 8 + ddl-auto: validate 이므로, 마이그레이션이 엔티티와 어긋나면
# backend 컨테이너가 Schema-validation 오류로 죽는다. 그게 정상 동작이다.

name: skala-fund-local

services:
  mysql:
    image: mysql:8.0
    container_name: skala-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skalafund
      MYSQL_USER: skala
      MYSQL_PASSWORD: skala
      TZ: Asia/Seoul
    command:
      # prod RDS 파라미터 그룹과 맞춘다. 카테고리명의 가운뎃점(·)이 깨지지 않으려면 utf8mb4 여야 한다.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      # 로컬에서만 여는 포트다. DBeaver 등으로 직접 붙어 스키마를 확인할 때 쓴다.
      - "3307:3306"
    volumes:
      - mysql-local-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skala-backend-local
    restart: unless-stopped
    depends_on:
      mysql:
        # MySQL 초기화가 끝나기 전에 붙으면 Flyway 가 커넥션 실패로 죽는다.
        condition: service_healthy
    environment:
      # dev 가 앞, local 이 뒤. local 이 dev 의 H2 설정을 덮어쓴다 (application-local.yml 주석 참조).
      SPRING_PROFILES_ACTIVE: dev,local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: skalafund
      DB_USERNAME: skala
      DB_PASSWORD: skala
      TZ: Asia/Seoul
    ports:
      # Vite dev server 의 proxy 대상이므로 로컬에서는 노출한다. (운영 compose 는 노출하지 않는다)
      - "8080:8080"
    volumes:
      - uploads-local:/app/uploads

volumes:
  mysql-local-data:
  uploads-local:
