name: CI

# PR 과 main push 에서 항상 돈다.
#
# CD 와 달리 여기에는 paths 필터를 걸지 않는다.
# 필수 상태 체크(required status check)로 지정한 잡이 paths 때문에 아예 실행되지 않으면
# PR 이 "대기 중" 상태로 영원히 머지되지 않는다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 연속 push 가 들어오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 21 / Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (의존성·빌드 캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # gradlew 가 저장소에 실행 권한 없이(100644) 들어 있어 리눅스 러너에서 그냥은 못 돈다.
      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      # build 태스크가 test 를 포함한다. 테스트가 깨지면 여기서 잡이 실패하고 머지가 막힌다.
      - name: Build & Test
        run: ./gradlew build test --no-daemon --stacktrace

      - name: 테스트 리포트 업로드 (실패 시 원인 확인용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 20 / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # 빌드 실패(문법 오류, import 누락 등)를 배포 전에 잡는다.
      - name: Build
        run: npm run build
