name: CD - Frontend

# main 에 프론트 변경이 들어왔을 때만 돈다 (paths 필터).
# nginx.conf 도 프론트 이미지에 구워지므로 여기 포함된다.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/cd-frontend.yml'
      - 'scripts/deploy-frontend.sh'

# cd-backend.yml 과 같은 그룹. EC2 한 대에서 두 배포가 동시에 nginx 를 건드리지 않게 한다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.FRONTEND_ECR_REPOSITORY }}

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 결정 (커밋 SHA)
        id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Recreate Nginx on EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH 접속 후 nginx 재생성
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          command_timeout: 10m
          script_stop: true
          envs: FRONTEND_IMAGE_TAG,AWS_REGION,ECR_REGISTRY
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.EC2_DEPLOY_PATH }}"

            git fetch --prune origin main
            git reset --hard origin/main
            chmod +x scripts/*.sh

            if grep -q '^FRONTEND_IMAGE_TAG=' .env; then
              sed -i "s#^FRONTEND_IMAGE_TAG=.*#FRONTEND_IMAGE_TAG=${FRONTEND_IMAGE_TAG}#" .env
            else
              echo "FRONTEND_IMAGE_TAG=${FRONTEND_IMAGE_TAG}" >> .env
            fi

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            # 재생성 후 .deploy-state 를 읽어 upstream 을 활성 슬롯으로 되돌린다.
            ./scripts/deploy-frontend.sh "${FRONTEND_IMAGE_TAG}"
        env:
          FRONTEND_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
