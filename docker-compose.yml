# SKALA-FUND 로컬 도커 환경
#
#   docker compose up -d --build
#   docker compose logs -f backend
#   docker compose down
#
# 프론트는 이 파일에 없다. Vite dev server 로 따로 띄운다.
#   cd frontend && npm run dev      -> http://localhost:3000
# vite.config.js 의 proxy 가 /api 요청을 http://localhost:8080 으로 넘긴다.
#
# DB 는 H2 인메모리(dev 프로파일)다. 컨테이너를 내렸다 올리면 데이터가 초기화된다.
# 이미지는 S3FileStorageService 가 S3 에 저장하므로 로컬 uploads 볼륨이 필요 없다.
# AWS/JWT 시크릿은 저장소 루트의 .env 에서 읽는다 (.env.example 참고).

name: skala-fund

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skala-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    ports:
      # Vite dev server 의 proxy 대상이므로 노출한다.
      - "8080:8080"
