spring:
  datasource:
    # 모든 접속 정보는 EC2 의 .env 를 통해 컨테이너 환경변수로 주입된다. 평문 금지.
    # allowPublicKeyRetrieval: MySQL 8 의 caching_sha2_password 로 붙을 때 필요하다.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
      # 후원 처리가 비관적 락을 쓰므로 락 대기가 길어지면 커넥션이 고갈된다.
      # 풀 크기를 줄이기 전에 락 구간을 먼저 확인할 것.
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      # 스키마는 Flyway 만 만든다. validate 이므로 마이그레이션과 엔티티가
      # 한 컬럼이라도 어긋나면 기동 단계에서 Schema-validation 오류로 죽는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 가운뎃점(·)이 들어간 카테고리명이 깨지지 않도록 명시한다.
    encoding: UTF-8
    validate-on-migrate: true
    # 이미 테이블이 있는 DB 에 처음 붙는 경우를 대비한다. 빈 스키마에서는 영향이 없다.
    baseline-on-migrate: true
    baseline-version: 0

# jwt.secret 은 application.yml 의 개발용 값을 prod 에서 반드시 덮어쓴다.
# 기본값을 두지 않아 JWT_SECRET 미주입 시 기동 자체가 실패하게 한다 (조용히 개발용 키로 뜨는 사고 방지).
jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        # 배포 스크립트 헬스체크와 컨테이너 헬스체크가 /actuator/health 를 쓴다.
        # env, beans, heapdump 등은 외부에 노출하지 않는다.
        include: health,info
  endpoint:
    health:
      # 상세 정보에는 DB 접속 정보와 내부 컴포넌트 이름이 섞여 나온다.
      # Nginx 를 통해 외부에 열리는 경로이므로 상태 문자열만 내려준다.
      show-details: never
      show-components: never
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    # 정산·상태전이 배치는 돈이 움직이는 지점이라 로그 레벨을 명시적으로 고정한다.
    # root 레벨을 WARN 으로 올려도 배치 기록은 남아야 한다.
    com.skala.fund.batch: INFO
    com.skala.fund.service.SettlementService: INFO
  pattern:
    # 컨테이너 stdout -> docker json-file 드라이버로 수집된다 (docs/infrastructure.md 참조).
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  cookie:
    # prod 는 HTTPS 종단이므로 Secure 쿠키를 유지한다.
    secure: true
