# 로컬 통합 환경 전용 (INF-10). docker-compose.local.yml 이 쓴다.
#
# 실행 프로파일은 `dev,local` 이다. 순서에 의미가 있다.
#   - dev  : LocalFileStorageService / WebConfig(/images/**) / CategoryInitializer /
#            HarnessSimulatorController 같은 @Profile("dev") 빈을 살린다.
#   - local: 뒤에 오므로 dev 의 H2 설정을 이 파일이 덮어쓴다.
#
# 목적은 prod 와 같은 조건(MySQL 8 + Flyway + ddl-auto: validate)에서 스키마를 검증하는 것이다.
# 여기서 기동에 성공하면 V1/V2 마이그레이션이 엔티티와 일치한다는 뜻이다.

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:skalafund}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:skala}
    password: ${DB_PASSWORD:skala}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # prod 와 동일하게 validate. 마이그레이션 누락을 로컬에서 잡기 위한 설정이다.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0

  h2:
    console:
      # MySQL 을 쓰므로 dev 에서 켜둔 H2 콘솔을 내린다.
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  storage:
    local-path: /app/uploads
  cookie:
    # 로컬은 http 라 Secure 쿠키가 브라우저에서 버려진다.
    secure: false
