spring:
  datasource:
    url: jdbc:h2:mem:skalafund;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  cookie:
    # 로컬은 http 라 Secure 쿠키가 브라우저에서 버려질 수 있으므로 dev 에서만 내린다.
    secure: false
