spring:
  datasource:
    url: jdbc:h2:mem:skalafund;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    # dev 는 H2 를 create-drop 으로 매번 새로 만들고 카테고리는 CategoryInitializer 가 넣는다.
    # 마이그레이션 SQL 은 MySQL 8 문법이므로 여기서 돌릴 이유도, 돌려서 좋을 것도 없다.
    # 명시하지 않으면 flyway-core 가 클래스패스에 있다는 이유만으로 자동 실행 대상이 된다.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  storage:
    local-path: ./uploads
  cookie:
    # 로컬은 http 라 Secure 쿠키가 브라우저에서 버려질 수 있으므로 dev 에서만 내린다.
    secure: false
