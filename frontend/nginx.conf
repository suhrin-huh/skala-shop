# SKALA-FUND Nginx 설정 (/etc/nginx/conf.d/default.conf 로 복사된다)
#
# 프론트 정적 파일 서빙 + /api 리버스 프록시를 한 서버에서 처리한다.
# 프론트와 API 가 같은 오리진이므로 백엔드에 CORS 설정이 필요 없다. 추가하지 말 것.

# ---------------------------------------------------------------------------
# 블루/그린 전환 지점.
# scripts/deploy.sh 가 아래 server 줄을 app-blue <-> app-green 으로 치환한 뒤
# `nginx -s reload` 를 보낸다. 줄 형식을 바꾸면 배포 스크립트의 치환이 깨진다.
# ---------------------------------------------------------------------------
upstream backend {
    server app-blue:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 이미지 업로드(jpg/png/webp) 대비. 기본값 1M 로는 413 이 난다.
    client_max_body_size 10M;

    charset utf-8;

    # 버전 노출 차단
    server_tokens off;

    # 정적 파일 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------
    # 운영용 헬스체크 경로.
    # 백엔드 Actuator 는 /actuator/health 에 있고 /api 프리픽스가 없다.
    # 외부에서 확인할 수 있도록 /api/actuator/health 로 매핑해 둔다.
    # (proxy_pass 뒤에 URI 를 적었으므로 경로가 치환된다)
    # -----------------------------------------------------------------------
    location = /api/actuator/health {
        access_log off;
        proxy_pass http://backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # API 리버스 프록시.
    # proxy_pass 뒤에 URI 를 붙이지 않았으므로 /api/ 를 포함한 원본 경로가 그대로 전달된다.
    # 백엔드 컨트롤러가 @RequestMapping("/api/...") 이므로 이대로여야 한다.
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 배치/정산처럼 오래 걸리는 요청이 있어 read timeout 을 조금 넉넉히 잡는다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 업로드 응답을 버퍼링하지 않는다.
        proxy_request_buffering off;
    }

    # 해시가 붙은 Vite 빌드 산출물(assets/index-XXXX.js)은 내용이 바뀌면 파일명도 바뀌므로
    # 오래 캐시해도 안전하다.
    #
    # 주의: add_header 는 상속되지 않는다. 하위 블록에 add_header 가 하나라도 있으면
    #       server 레벨의 보안 헤더가 통째로 사라지므로 필요한 것을 다시 선언한다.
    #       expires 와 add_header Cache-Control 을 같이 쓰면 Cache-Control 이 두 줄 나가므로
    #       add_header 하나로 통일한다.
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html 은 절대 캐시하지 않는다.
    # 캐시되면 새 배포 뒤에도 옛 assets 해시를 가리켜 흰 화면이 뜬다.
    # try_files 의 내부 리다이렉트가 이 exact-match 블록으로 다시 들어온다.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # -----------------------------------------------------------------------
    # SPA 폴백.
    # try_files 가 없으면 /projects/3 에서 새로고침할 때 nginx 가 그 경로의 파일을
    # 찾다 실패해 404 를 낸다. index.html 로 넘겨 React Router 가 처리하게 한다.
    # -----------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
